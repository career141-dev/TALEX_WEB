services:
  postgres:
    image: postgres:15-alpine
    container_name: talex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: talex_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: talex_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
